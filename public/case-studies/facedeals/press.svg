<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26C5FF"/><stop offset="0.5" stop-color="#CA43FF"/><stop offset="1" stop-color="#FF419F"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="880" fill="#101117"/>
  <rect width="1500" height="880" fill="url(#grid)"/>
  <rect width="1500" height="3" fill="url(#brand)"/>
  <g font-family="JetBrains Mono">
    <text x="64" y="72" fill="#B4B6C2" font-size="13" letter-spacing="3">FACEDEALS · PRESS</text>
    <text x="64" y="108" fill="#E6E7EE" font-size="24">Ten outlets in one month, CBS three years on. The reaction split down the middle.</text>

  <rect x="64.0" y="150" width="325.0" height="196" rx="6" fill="#15161E" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <rect x="64.0" y="150" width="325.0" height="2" fill="url(#brand)"/>
  <text x="86.0" y="190" fill="#B4B6C2" font-size="12" letter-spacing="2">TECHCRUNCH</text>
  <text x="86.0" y="212" fill="#8C8E9C" font-size="11">Aug 10, 2012</text>
  <text x="86.0" y="246" fill="#E6E7EE" font-size="17">Check-in on Facebook with</text><text x="86.0" y="272" fill="#E6E7EE" font-size="17">facial recognition. Creepy</text><text x="86.0" y="298" fill="#E6E7EE" font-size="17">or awesome?</text>
  <rect x="413.0" y="150" width="325.0" height="196" rx="6" fill="#15161E" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <rect x="413.0" y="150" width="325.0" height="2" fill="url(#brand)"/>
  <text x="435.0" y="190" fill="#B4B6C2" font-size="12" letter-spacing="2">COMPUTERWORLD</text>
  <text x="435.0" y="212" fill="#8C8E9C" font-size="11">Aug 2012</text>
  <text x="435.0" y="246" fill="#E6E7EE" font-size="17">Can Facedeals overcome the</text><text x="435.0" y="272" fill="#E6E7EE" font-size="17">“creepy” factor?</text>
  <rect x="762.0" y="150" width="325.0" height="196" rx="6" fill="#15161E" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <rect x="762.0" y="150" width="325.0" height="2" fill="url(#brand)"/>
  <text x="784.0" y="190" fill="#B4B6C2" font-size="12" letter-spacing="2">GIZMODO</text>
  <text x="784.0" y="212" fill="#8C8E9C" font-size="11">Aug 2012</text>
  <text x="784.0" y="246" fill="#E6E7EE" font-size="17">Foursquare-type check-in</text><text x="784.0" y="272" fill="#E6E7EE" font-size="17">service Facedeals uses your</text><text x="784.0" y="298" fill="#E6E7EE" font-size="17">face</text>
  <rect x="1111.0" y="150" width="325.0" height="196" rx="6" fill="#15161E" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <rect x="1111.0" y="150" width="325.0" height="2" fill="url(#brand)"/>
  <text x="1133.0" y="190" fill="#B4B6C2" font-size="12" letter-spacing="2">DAILY MAIL</text>
  <text x="1133.0" y="212" fill="#8C8E9C" font-size="11">Aug 13, 2012</text>
  <text x="1133.0" y="246" fill="#E6E7EE" font-size="17">We’re watching: the camera</text><text x="1133.0" y="272" fill="#E6E7EE" font-size="17">that can recognise your</text><text x="1133.0" y="298" fill="#E6E7EE" font-size="17">Facebook picture</text>
  <rect x="64.0" y="370" width="325.0" height="196" rx="6" fill="#15161E" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <rect x="64.0" y="370" width="325.0" height="2" fill="url(#brand)"/>
  <text x="86.0" y="410" fill="#B4B6C2" font-size="12" letter-spacing="2">ADWEEK</text>
  <text x="86.0" y="432" fill="#8C8E9C" font-size="11">Aug 2012</text>
  <text x="86.0" y="466" fill="#E6E7EE" font-size="17">Redpepper’s Facedeals</text>
  <rect x="413.0" y="370" width="325.0" height="196" rx="6" fill="#15161E" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <rect x="413.0" y="370" width="325.0" height="2" fill="url(#brand)"/>
  <text x="435.0" y="410" fill="#B4B6C2" font-size="12" letter-spacing="2">NASHVILLE POST</text>
  <text x="435.0" y="432" fill="#8C8E9C" font-size="11">Aug 2012</text>
  <text x="435.0" y="466" fill="#E6E7EE" font-size="17">Redpepper’s Facedeals:</text><text x="435.0" y="492" fill="#E6E7EE" font-size="17">taking geolocation to the</text><text x="435.0" y="518" fill="#E6E7EE" font-size="17">next level</text>
  <rect x="762.0" y="370" width="325.0" height="196" rx="6" fill="#15161E" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <rect x="762.0" y="370" width="325.0" height="2" fill="url(#brand)"/>
  <text x="784.0" y="410" fill="#B4B6C2" font-size="12" letter-spacing="2">SECUREIDNEWS</text>
  <text x="784.0" y="432" fill="#8C8E9C" font-size="11">Aug 15, 2012</text>
  <text x="784.0" y="466" fill="#E6E7EE" font-size="17">Facedeals makes social media</text><text x="784.0" y="492" fill="#E6E7EE" font-size="17">check-in easier</text>
  <rect x="1111.0" y="370" width="325.0" height="196" rx="6" fill="#15161E" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <rect x="1111.0" y="370" width="325.0" height="2" fill="url(#brand)"/>
  <text x="1133.0" y="410" fill="#B4B6C2" font-size="12" letter-spacing="2">LAUGHING SQUID</text>
  <text x="1133.0" y="432" fill="#8C8E9C" font-size="11">Aug 2012</text>
  <text x="1133.0" y="466" fill="#E6E7EE" font-size="17">Automatic Facebook check-ins</text><text x="1133.0" y="492" fill="#E6E7EE" font-size="17">with facial recognition</text>
  <rect x="64.0" y="590" width="325.0" height="196" rx="6" fill="#15161E" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <rect x="64.0" y="590" width="325.0" height="2" fill="url(#brand)"/>
  <text x="86.0" y="630" fill="#B4B6C2" font-size="12" letter-spacing="2">WTOP</text>
  <text x="86.0" y="652" fill="#8C8E9C" font-size="11">Aug 2012</text>
  <text x="86.0" y="686" fill="#E6E7EE" font-size="17">Your face could get you a</text><text x="86.0" y="712" fill="#E6E7EE" font-size="17">discount</text>
  <rect x="413.0" y="590" width="325.0" height="196" rx="6" fill="#15161E" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <rect x="413.0" y="590" width="325.0" height="2" fill="url(#brand)"/>
  <text x="435.0" y="630" fill="#B4B6C2" font-size="12" letter-spacing="2">LS:N GLOBAL</text>
  <text x="435.0" y="652" fill="#8C8E9C" font-size="11">Aug 2012</text>
  <text x="435.0" y="686" fill="#E6E7EE" font-size="17">In your face: a good deal</text><text x="435.0" y="712" fill="#E6E7EE" font-size="17">for check-in culture</text>
  <rect x="762.0" y="590" width="325.0" height="196" rx="6" fill="#15161E" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <rect x="762.0" y="590" width="325.0" height="2" fill="url(#brand)"/>
  <text x="784.0" y="630" fill="#B4B6C2" font-size="12" letter-spacing="2">CBS NEWS</text>
  <text x="784.0" y="652" fill="#8C8E9C" font-size="11">Sep 24, 2015</text>
  <text x="784.0" y="686" fill="#E6E7EE" font-size="17">Facedeals targets likes and</text><text x="784.0" y="712" fill="#E6E7EE" font-size="17">location</text>
    <text x="64" y="826" fill="#8C8E9C" font-size="11">Headlines as published or as titled by the outlet.</text>
  </g>
