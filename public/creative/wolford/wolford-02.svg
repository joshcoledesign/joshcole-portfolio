<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500" role="img" aria-label="Two models on a garden bench in patterned tights">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26C5FF"/>
      <stop offset="0.5" stop-color="#CA43FF"/>
      <stop offset="1" stop-color="#FF419F"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1500" fill="#101117"/>
  <rect width="1000" height="1500" fill="url(#grid)"/>
  <rect width="1000" height="3" fill="url(#brand)"/>
  <g font-family="'JetBrains Mono', monospace">
    <text x="32" y="1444" fill="#B4B6C2" font-size="12">wolford-02.jpg</text>
